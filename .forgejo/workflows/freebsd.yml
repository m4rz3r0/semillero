# Compila semillero para FreeBSD al subir una etiqueta vX.Y.Z a Forgejo y lo
# publica como la release de Forgejo de esa etiqueta, de donde lo instala el
# actualizador del servidor (deploy/freebsd/actualizar.sh). El servidor no
# compila nunca.
#
# Corre en el PC: un runner de Forgejo Actions con la etiqueta «pc» y el
# ejecutor host (deploy/README.md, «Runner de Forgejo Actions en el PC»),
# con cross, cargo, podman, git, curl y jq. Si el PC está apagado, el
# trabajo espera a que se encienda (ABANDONED_JOB_TIMEOUT de Forgejo).
#
# Sin acciones de terceros (ni actions/checkout): el primer paso trae solo
# la etiqueta con git y el token del trabajo en una cabecera que va por el
# entorno de git (GIT_CONFIG_*), nunca en los argumentos ni en una URL; el
# segundo compila y publica con deploy/cross/publicar-forgejo.sh.
#
# Que exista .forgejo/workflows/ hace que Forgejo no corra los flujos de
# .github/workflows/ (son los de GitHub).

name: freebsd

on:
  push:
    tags: ["v*"]

jobs:
  freebsd:
    runs-on: pc
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Traer la etiqueta
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
          FORGEJO_SERVER_URL: ${{ forgejo.server_url }}
          FORGEJO_REPOSITORY: ${{ forgejo.repository }}
          FORGEJO_REF_NAME: ${{ forgejo.ref_name }}
        run: |
          set -euo pipefail
          case $FORGEJO_REF_NAME in
          v[0-9]*) ;;
          *) echo "ERROR: «$FORGEJO_REF_NAME» no es una etiqueta vX.Y.Z" >&2; exit 1 ;;
          esac
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="Authorization: token $FORGEJO_TOKEN"
          export GIT_TERMINAL_PROMPT=0
          git init --quiet .
          git fetch --quiet --depth 1 "$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git" "refs/tags/$FORGEJO_REF_NAME"
          git checkout --quiet --force FETCH_HEAD
          git clean -ffdxq

      - name: Compilar y publicar la release
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
          FORGEJO_SERVER_URL: ${{ forgejo.server_url }}
          FORGEJO_REPOSITORY: ${{ forgejo.repository }}
          FORGEJO_REF_NAME: ${{ forgejo.ref_name }}
        run: bash deploy/cross/publicar-forgejo.sh
